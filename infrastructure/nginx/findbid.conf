# 참고용 문서입니다. 서버(호스트)의 nginx가 직접 읽는 파일은
# /etc/nginx/sites-available/findbid 이며, docker compose 스택에는 포함되지 않습니다.
# 갱신 시 이 파일도 함께 업데이트해서 실제 운영 설정과 맞춰주세요.
#
# 전제: findbid.it / www.findbid.it 가 이 서버 IP로 A 레코드 연결됨
#       compose.yaml의 frontend 포트는 127.0.0.1:3100 으로 바인딩됨 (외부 비노출)
#       인증서는 certbot --webroot -w /var/www/certbot 로 발급
#
# nginx 1.24(Ubuntu 24.04 기본 패키지) 문법 기준입니다.
# nginx 1.25.1+ 라면 `listen 443 ssl;` + `http2 on;` 조합으로 바꿔도 됩니다.

server {
    listen 80;
    server_name findbid.it www.findbid.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name findbid.it www.findbid.it;

    ssl_certificate     /etc/letsencrypt/live/findbid.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/findbid.it/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
